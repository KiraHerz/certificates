<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<title>Сертификаты Per Aspera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: narrow control rail on the left, the certificate sheet as a live, scaled preview on the right; stacks on phones */
:root{
  --bg:#eceef0; --panel:#ffffff; --fg:#16171a; --muted:#6a6e75; --line:#dcdfe3; --field:#f4f5f7; --focus:#3643f7;
  --accent:#3643f7; --accent-fg:#ffffff; --ok:#1d7a46; --err:#b42318;
  --ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* the certificate itself is a fixed printed object: its colours never follow the theme */
  --cert-white:#ffffff; --cert-rule:rgba(255,255,255,.2); --cert-pill-border:rgba(255,255,255,.3);
  --cert-font:"SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --cert-display:"Helvetica Neue", Helvetica, "Inter", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --panel:#1a1b1e; --fg:#eceef1; --muted:#9a9ea6; --line:#2c2e33; --field:#222428; --focus:#8f97ff;
    --ok:#4cc583; --err:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --panel:#1a1b1e; --fg:#eceef1; --muted:#9a9ea6; --line:#2c2e33; --field:#222428; --focus:#8f97ff;
  --ok:#4cc583; --err:#ff8a7a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;
  padding-block:28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:16px}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:20px;position:sticky;top:max(16px, env(safe-area-inset-top, 0px))}
@media (max-width:820px){.panel{position:static}}
.brand{display:flex;flex-direction:column;gap:4px}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.group{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.group > .lbl,.group > legend{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0;margin-bottom:0}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dir{position:relative}
.dir input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.dir span{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:13.5px;font-weight:500;line-height:1.2;cursor:pointer;min-height:48px}
.dir i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(127,127,127,.35)}
.dir input:checked + span{border-color:var(--fg);background:var(--panel);box-shadow:inset 0 0 0 1px var(--fg)}
.dir input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2.date{grid-template-columns:1.4fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{resize:vertical;min-height:72px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative;text-align:center}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:7px 8px;border-radius:7px;font-size:13.5px;font-weight:500;cursor:pointer}
.seg input:checked + span{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.seg input:focus-visible + span{outline:2px solid var(--focus)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.btn{appearance:none;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.6;cursor:progress}
.btn svg{width:18px;height:18px}
.status{min-height:20px;font-size:13px;color:var(--muted);margin:-10px 0 0}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}

.stage{min-width:0}
.sheet-wrap{position:relative;width:100%;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.14)}
.sheet-scale{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- certificate (1000 × 1360, coordinates from the Figma template) ---------- */
.cert{position:relative;width:1000px;height:1360px;overflow:hidden;color:var(--cert-white);font-family:var(--cert-font);font-weight:500;font-size:24px;letter-spacing:-0.03em;-webkit-font-smoothing:antialiased}
.cert .a{position:absolute}
.cert p{margin:0}
.c-name{font-size:100px;line-height:.945;letter-spacing:-0.02em;white-space:nowrap}
.c-name span{display:inline-block}
.c-intro{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.c-intro p{line-height:1.2}
.c-pill{width:240px;height:49px;border-radius:100px;border:1px solid var(--cert-pill-border);display:flex;align-items:center;justify-content:center;line-height:1.2;white-space:nowrap;padding:0 20px}
.c-lic{width:220px;font-size:15.67px;display:flex;flex-direction:column;gap:6.5px}
.c-lic .l1{line-height:1}
.c-lic .l2{line-height:.655;opacity:.5}
.c-logo,.c-sig,.c-badge img{display:block}
.c-col{width:460px;display:flex;flex-direction:column;gap:20px}
.c-row{display:grid;grid-template-columns:240px 220px;border-top:1px solid var(--cert-rule);padding-top:10px;line-height:1.05}
.c-row .k{opacity:.54}
.c-rule{height:0;border-top:1px solid var(--cert-rule)}
.c-lbl{line-height:1.05;width:189px}
.c-list{margin:0;padding:0;list-style:none;line-height:1.05;display:flex;flex-direction:column;gap:9.8px}
.c-list li{position:relative;padding-left:36px}
.c-list li::before{content:"";position:absolute;left:14px;top:9.6px;width:6px;height:6px;border-radius:50%;background:var(--cert-white)}
.c-foot{line-height:.655;white-space:nowrap}
.c-foot.dim{opacity:.5}
.c-big{font-family:var(--cert-display);font-weight:400;line-height:.9;white-space:nowrap;left:24px}
.c-badge{width:80px;height:80px}
.c-badge span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1}
.c-ach{line-height:1.05}

@media (prefers-reduced-motion: no-preference){.sheet-scale{transition:none}}
</style>

<div class="app">
  <form class="panel" id="form" autocomplete="off">
    <div class="brand">
      <h1>Сертификаты Per Aspera</h1>
      <p>Выберите программу, впишите выпускника и скачайте PDF.</p>
    </div>

    <fieldset class="group">
      <legend>Направление</legend>
      <div class="dirs" id="dirs"></div>
    </fieldset>

    <div class="group">
      <div class="lbl">Выпускник</div>
      <div class="row2">
        <div class="field"><label for="first">Имя</label><input type="text" id="first" value="Диана" maxlength="40"></div>
        <div class="field"><label for="last">Фамилия</label><input type="text" id="last" value="Херман" maxlength="40"></div>
      </div>
      <div class="seg" id="genderSeg" role="radiogroup" aria-label="Окончание глагола">
        <label><input type="radio" name="gender" id="g-m" value="m" checked><span>завершил</span></label>
        <label><input type="radio" name="gender" id="g-f" value="f"><span>завершила</span></label>
      </div>
    </div>

    <div class="group">
      <div class="lbl">Дата выдачи</div>
      <div class="row2 date">
        <div class="field"><label for="month">Месяц</label><select id="month"></select></div>
        <div class="field"><label for="year">Год</label><input type="number" id="year" min="2020" max="2100" inputmode="numeric"></div>
      </div>
    </div>

    <div class="group">
      <div class="lbl">Язык сертификата</div>
      <div class="seg" role="radiogroup" aria-label="Язык">
        <label><input type="radio" name="lang" id="lang-ru" value="ru" checked><span>Русский</span></label>
        <label><input type="radio" name="lang" id="lang-en" value="en"><span>English</span></label>
      </div>
    </div>

    <div class="group" id="achGroup" hidden>
      <div class="lbl">Особые достижения</div>
      <label class="check"><input type="checkbox" id="achOn" checked> Показывать в сертификате</label>
      <div class="field"><label for="achText">Текст</label><textarea id="achText" maxlength="160"></textarea></div>
      <div class="field"><label for="achBadge">Надпись на значке</label><input type="text" id="achBadge" value="PD" maxlength="3"></div>
    </div>

    <button type="submit" class="btn" id="dl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
      <span>Скачать PDF</span>
    </button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint">Основной шрифт — SF Pro Display. Если он не установлен на устройстве, в сертификат подставится Inter.</p>
  </form>

  <section class="stage" aria-label="Предпросмотр сертификата">
    <div class="sheet-wrap" id="wrap"><div class="sheet-scale" id="scaler"><div class="cert" id="cert"></div></div></div>
    <div class="stage-meta"><span id="metaName"></span><span>1000 × 1360</span></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  if(a>=2 && a<=4 && (b<12 || b>14)) return 'академических часа';
  return 'академических часов';
}
/* letter-spacing of the big word, per letter, as set in the template (percent of font size) */
const BIG_LS = { ru:[-7,-7,-5,-5,-7,-7,-9,0,-9,-7], en:null };
const ACH_DEFAULT = {
  ru:'Продуктовый фотосет проекта PILL-PET: награда Dprofile в категории «Промдизайн»',
  en:'Product photo shoot for the PILL-PET project: Dprofile award in the “Industrial Design” category'
};

/* ---------- state ---------- */
const now = new Date();
const state = { dir:'web', first:'Диана', last:'Херман', gender:'m', lang:'ru', month:now.getMonth(), year:now.getFullYear(),
  achOn:true, ach:{...ACH_DEFAULT}, achEdited:{ru:false,en:false}, badge:'PD' };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/\n/g,'<br>');

/* ---------- controls ---------- */
$('dirs').innerHTML = ORDER.map(k => `<label class="dir" style="--dot:${DIRS[k].color}"><input type="radio" name="dir" id="dir-${k}" value="${k}"${k===state.dir?' checked':''}><span><i></i>${esc(DIRS[k].pill)}</span></label>`).join('');
function fillMonths(){
  const sel = $('month'), cur = state.month;
  sel.innerHTML = COPY[state.lang].months.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  sel.value = String(cur);
}
fillMonths();
$('year').value = state.year;

/* ---------- render ---------- */
function render(){
  const d = DIRS[state.dir], L = COPY[state.lang], v = VAR[d.v], c = L[d.v], T = d[state.lang];
  const isAI = state.dir === 'ai';
  const showAch = isAI && state.achOn && state.ach[state.lang].trim();
  let n = 0;
  const col = (items, x) => `<div class="a c-col" style="left:${x}px;top:${d.modTop}px">${items.map(t => `<div class="c-row"><span class="k">${L.module} ${n++}</span><span>${br(t)}</span></div>`).join('')}</div>`;
  const list = items => `<ul class="c-list">${items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  const toolsX = isAI ? 517 : 510, toolsListX = isAI ? 757 : 747, rightRuleX = isAI ? 514 : 510;
  const big = L.big.split('').map((ch,i)=>{
    const ls = BIG_LS[state.lang] ? BIG_LS[state.lang][i] : -6;
    return `<span style="letter-spacing:${ls/100}em">${ch}</span>`;
  }).join('');

  const html = `
    <div class="a c-name" id="cName" style="left:24px;top:${v.nameTop}px"><span id="n1">${esc(state.first || ' ')}</span><br><span id="n2">${esc(state.last || ' ')}</span></div>
    <div class="a c-intro" style="left:${v.introLeft}px;top:${v.introTop}px;width:${v.introW}px">
      <p>${esc(L.intro(d, state.gender))}</p>
      <div class="c-pill" style="background:${d.color}">${esc(d.pill)}</div>
    </div>
    <div class="a c-lic" style="left:${v.licLeft}px;top:${v.licTop}px"><p class="l1">${esc(c.lic1)}</p><p class="l2">${esc(c.lic2)}</p></div>
    <img class="a c-logo" src="${LOGO_URI}" width="220" height="220" alt="" style="left:750px;top:36px">
    ${col(T.mods[0], 30)}${col(T.mods[1], d.rightX)}
    <div class="a c-rule sec" style="left:30px;top:${d.secY}px;width:460px"></div>
    <div class="a c-rule sec" style="left:${rightRuleX}px;top:${d.secY}px;width:460px"></div>
    <div class="a c-lbl sec" style="left:30px;top:${d.secY+15}px">${esc(c.proj)}</div>
    <div class="a sec sec-list" style="left:${d.projX}px;top:${d.secY+15}px;width:${d.projW}px">${list(T.proj)}</div>
    <div class="a c-lbl sec" style="left:${toolsX}px;top:${d.secY+15}px;width:220px">${esc(c.tools)}</div>
    <div class="a sec sec-list" style="left:${toolsListX}px;top:${d.secY+15}px;width:223px">${list(d.tools)}</div>
    ${showAch ? `
      <div class="a c-rule achv" style="left:30px;top:928px;width:944px"></div>
      <div class="a c-lbl achv" style="left:33px;top:941px;width:165px">${esc(L.ach)}</div>
      <div class="a c-badge achv" style="left:270px;top:935px"><img src="${STAR_URI}" width="80" height="80" alt=""><span>${esc(state.badge)}</span></div>
      <p class="a c-ach achv" style="left:365px;top:950px;width:465px">${esc(state.ach[state.lang])}</p>` : ''}
    <p class="a c-foot" style="left:30px;top:${v.urlY}px">${esc(c.url)}</p>
    <p class="a c-foot dim" style="left:30px;top:${v.dateY}px">${esc(L.months[state.month])} ${esc(state.year)}</p>
    <p class="a c-foot" style="left:510px;top:${v.urlY}px">${esc(c.who)}</p>
    <p class="a c-foot dim" style="left:510px;top:${v.dateY}px">${esc(c.role)}</p>
    <img class="a c-sig" src="${SIG_URI}" width="147" height="116" alt="" style="left:${d.sig[0]}px;top:${d.sig[1]}px">
    <div class="a c-big" id="cBig" style="top:1203px">${big}</div>`;

  const cert = $('cert');
  cert.style.background = d.bg;
  cert.innerHTML = html;
  fit(cert, d);
  $('metaName').textContent = `${state.first} ${state.last} · ${d.pill}`.trim();
  $('genderSeg').hidden = state.lang !== 'ru';
  $('achGroup').hidden = !isAI;
}

/* keep long names inside their area and stretch the big word to the template width */
function fit(root, d){
  const v = VAR[d.v];
  const name = root.querySelector('#cName'), n1 = root.querySelector('#n1'), n2 = root.querySelector('#n2');
  const max1 = v.licLeft - 24 - 28, max2 = 750 - 24 - 28;
  let fs = 100;
  name.style.fontSize = fs + 'px';
  while (fs > 44 && (n1.offsetWidth > max1 || n2.offsetWidth > max2)) { fs -= 2; name.style.fontSize = fs + 'px'; }
  /* if module titles wrap more than in the template, push the lower sections down instead of overlapping */
  const shift = (sel, delta) => { if (delta > 0) root.querySelectorAll(sel).forEach(el => { el.style.top = (parseFloat(el.style.top) + delta) + 'px'; }); };
  const bottomOf = sel => Math.max(0, ...[...root.querySelectorAll(sel)].map(el => el.offsetTop + el.offsetHeight));
  shift('.sec', bottomOf('.c-col') + 45 - d.secY);
  if (root.querySelector('.achv')) shift('.achv', bottomOf('.sec-list') + 17 - 928);
  const big = root.querySelector('#cBig');
  big.style.fontSize = '152.3px';
  const w = big.offsetWidth;
  if (w > 0) big.style.fontSize = (152.3 * 946 / w).toFixed(2) + 'px';
  big.style.top = (1340 - big.offsetHeight) + 'px';
}

/* scale the 1000 × 1360 sheet to the preview column */
function scalePreview(){
  const wrap = $('wrap'), s = wrap.clientWidth / 1000;
  $('scaler').style.transform = `scale(${s})`;
  wrap.style.height = (1360 * s) + 'px';
}
new ResizeObserver(scalePreview).observe($('wrap'));

/* ---------- inputs ---------- */
const form = $('form');
form.addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'dir') state.dir = t.value;
  else if (t.name === 'gender') state.gender = t.value;
  else if (t.name === 'lang') { state.lang = t.value; fillMonths(); syncAch(); }
  else if (t.id === 'first') state.first = t.value.trim();
  else if (t.id === 'last') state.last = t.value.trim();
  else if (t.id === 'month') state.month = +t.value;
  else if (t.id === 'year') state.year = t.value.trim();
  else if (t.id === 'achOn') state.achOn = t.checked;
  else if (t.id === 'achText') { state.ach[state.lang] = t.value; state.achEdited[state.lang] = true; }
  else if (t.id === 'achBadge') state.badge = t.value.trim();
  render();
});
function syncAch(){ $('achText').value = state.ach[state.lang]; }
syncAch();

/* ---------- PDF ---------- */
async function getDownloads(){
  try { return (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; }
  catch { return null; }
}
function setStatus(msg, kind){ const s = $('status'); s.textContent = msg; s.className = 'status' + (kind ? ' ' + kind : ''); }

async function buildPdf(){
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const bg = DIRS[state.dir].bg;
  const canvas = await html2canvas($('cert'), {
    scale: 2.5, backgroundColor: bg, logging: false, scrollX: 0, scrollY: 0, windowWidth: 1600,
    /* render the sheet at its real 1000 × 1360 size, without the preview scaling */
    onclone: doc => {
      const sc = doc.getElementById('scaler'), wr = doc.getElementById('wrap');
      sc.style.transform = 'none';
      wr.style.cssText += ';width:1000px;height:1360px;overflow:visible;border-radius:0;box-shadow:none';
    }
  });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [750, 1020], compress: true });
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 750, 1020);
  pdf.setProperties({ title: `${COPY[state.lang].big} — ${state.first} ${state.last}`, subject: DIRS[state.dir].pill, creator: 'Per Aspera Ad Astra' });
  return pdf;
}
function fileName(){
  const who = `${state.first} ${state.last}`.trim() || 'Выпускник';
  const word = state.lang === 'ru' ? 'Сертификат' : 'Certificate';
  return `${word} — ${who} — ${DIRS[state.dir].pill}.pdf`.replace(/[\\/:*?"<>|]+/g, '-');
}
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!state.first && !state.last) { setStatus('Впишите имя или фамилию выпускника.', 'err'); $('first').focus(); return; }
  const btn = $('dl'); btn.disabled = true; setStatus('Собираю PDF…');
  try {
    const pdf = await buildPdf();
    const name = fileName();
    const downloadsApi = await getDownloads();
    if (downloadsApi) {
      try { await downloadsApi.save({ filename: name, data: pdf.output('blob') }); setStatus('PDF сохранён: ' + name, 'ok'); }
      catch (err) {
        const code = err && err.code;
        if (code === 'declined') setStatus('Сохранение отменено.');
        else if (code === 'rate_limited') setStatus('Окно сохранения уже открыто — подтвердите его или попробуйте через пару секунд.', 'err');
        else setStatus('Не удалось сохранить файл здесь. Откройте страницу в браузере и попробуйте снова.', 'err');
      }
    } else {
      pdf.save(name);
      setStatus('PDF скачан: ' + name, 'ok');
    }
  } catch (err) {
    setStatus('Не получилось собрать PDF. Обновите страницу и попробуйте ещё раз.', 'err');
  } finally { btn.disabled = false; }
});

render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>

</body>
